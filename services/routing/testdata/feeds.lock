# External GTFS Feed Snapshots Registry

This lockfile pins external GTFS archive snapshots used for golden regression testing and benchmarks.
Run `make fetch-feeds` to download or update archives into `testdata/feeds/`.

## Pinned Feeds

### MBTA Boston (Primary Real-World Feed)
- **URL**: https://cdn.mbta.com/MBTA_GTFS.zip
- **Version/Date**: 2026-11-01
- **File**: services/routing/testdata/feeds/mbta_gtfs.zip
- **License**: MassDOT Developers License Agreement (Free, commercial use OK with attribution)

