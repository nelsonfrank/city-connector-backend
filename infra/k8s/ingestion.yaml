apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ingestion
              image: nelsonfrank/ingestion:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-c", "print('Ingestion job complete.')"]
          restartPolicy: OnFailure
