apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routing
  template:
    metadata:
      labels:
        app: routing
    spec:
      containers:
        - name: routing
          image: nelsonfrank/routing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: routing
spec:
  selector:
    app: routing
  ports:
    - port: 8081
      targetPort: 8081
